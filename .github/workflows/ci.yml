name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    name: Managed build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate release and helper scripts
        run: |
          python3 -m py_compile scripts/verify-release-assets.py
          python3 -m py_compile scripts/verify-nuget-package.py
          python3 -m py_compile scripts/verify-native-license-inventory.py
          python3 -m py_compile scripts/verify-pion-license-inventory.py
          python3 -m py_compile scripts/generate-cubeb-license-inventories.py
          python3 -m py_compile scripts/verify-cubeb-provenance.py
          python3 scripts/verify-release-assets.py --self-test
          bash -n scripts/package-release.sh scripts/package-api.sh scripts/build-helpers.sh scripts/build-mac.sh scripts/build-pion.sh scripts/ci-smoke-helper.sh
          bash scripts/package-release.sh --validate-source
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            packages.lock.json
            PerfectComms.Tests/packages.lock.json
      - name: Restore locked dependencies
        run: dotnet restore PerfectComms.Tests/PerfectComms.Tests.csproj --locked-mode --nologo
      - name: Build desktop managed code
        run: dotnet build PerfectComms.csproj -c Release --no-restore --nologo
      - name: Pack and smoke-test developer API
        run: bash scripts/package-api.sh Release
      - name: Run managed tests
        run: dotnet test PerfectComms.Tests/PerfectComms.Tests.csproj -c Release --no-restore --nologo
      - name: Test meeting compatibility against Among Us v18 bindings
        run: >-
          dotnet test PerfectComms.Tests/PerfectComms.Tests.csproj -c Release --nologo
          --filter FullyQualifiedName~PlayerVoteAreaPlayerIdTests
          -p:AmongUsGameLibsVersion=2026.8.18
          -p:NuGetLockFilePath=obj/compat-v18/packages.lock.json
          -p:RestoreLockedMode=false

  starlight:
    name: Starlight managed build, tests, and single-DLL validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify Starlight source policy
        run: |
          python3 scripts/verify-release-assets.py --root . --starlight-source
          bash -n scripts/package-starlight.sh scripts/starlight-pion-interop.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            Starlight/packages.media.lock.json
            Starlight/packages.plugin.lock.json
            Starlight/DependencySanitizer/packages.lock.json
            PerfectComms.Starlight.Tests/packages.lock.json
      - name: Restore locked Starlight dependencies
        run: |
          dotnet restore Starlight/DependencySanitizer/DependencySanitizer.csproj --locked-mode --nologo
          dotnet restore PerfectComms.Starlight.Tests/PerfectComms.Starlight.Tests.csproj --locked-mode --nologo
      - name: Build and self-test dependency sanitizer
        run: |
          dotnet build Starlight/DependencySanitizer/DependencySanitizer.csproj -c Release --no-restore --nologo
          dotnet Starlight/DependencySanitizer/bin/Release/net10.0/DependencySanitizer.dll self-test
      - name: Build and test managed Starlight media
        run: |
          dotnet build PerfectComms.Starlight.Tests/PerfectComms.Starlight.Tests.csproj -c Release --no-restore --nologo
          dotnet test PerfectComms.Starlight.Tests/PerfectComms.Starlight.Tests.csproj -c Release --no-build --no-restore --nologo
      - name: Build and validate Starlight DLL
        run: |
          bash scripts/package-starlight.sh Release
          python3 scripts/verify-release-assets.py --starlight-dll artifacts/PerfectCommsStarlight.dll
          dotnet Starlight/DependencySanitizer/bin/Release/net10.0/DependencySanitizer.dll validate \
            --assembly artifacts/PerfectCommsStarlight.dll
          test ! -d artifacts/PerfectComms-Starlight
          shopt -s nocaseglob nullglob
          for artifact in artifacts/*.dll artifacts/*.zip; do
            test "$artifact" = "artifacts/PerfectCommsStarlight.dll" || {
              echo "Unexpected Starlight artifact: $artifact" >&2
              exit 1
            }
          done

  starlight-desktop-interop:
    name: Starlight and desktop Pion interoperability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            Starlight/packages.media.lock.json
            Starlight/packages.plugin.lock.json
            Starlight/DependencySanitizer/packages.lock.json
            Starlight/InteropProbe/packages.lock.json
      - name: Build deterministic merged Starlight DLL
        shell: pwsh
        run: .\scripts\package-starlight.ps1 Release
      - name: Restore locked interoperability dependencies
        env:
          MERGED_STARLIGHT_ASSEMBLY_PATH: ${{ github.workspace }}\artifacts\PerfectCommsStarlight.dll
        run: >-
          dotnet restore
          Starlight/InteropProbe/PerfectComms.Starlight.InteropProbe.csproj
          --locked-mode
          --nologo
          -p:MergedStarlightAssemblyPath="$env:MERGED_STARLIGHT_ASSEMBLY_PATH"
      - name: Test merged managed WebRTC against the desktop Pion transport
        env:
          MERGED_STARLIGHT_ASSEMBLY_PATH: ${{ github.workspace }}\artifacts\PerfectCommsStarlight.dll
          PC_PION_TEST_DISABLE_MDNS: "1"
        run: >-
          dotnet run
          --project Starlight/InteropProbe/PerfectComms.Starlight.InteropProbe.csproj
          --configuration Release
          --no-restore
          -p:MergedStarlightAssemblyPath="$env:MERGED_STARLIGHT_ASSEMBLY_PATH"
          --
          --pion "${{ github.workspace }}\Libs\pion\pc-pion.x64.dll"


  native-quality:
    name: Native format, lint, and tests
    runs-on: ubuntu-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
          cache-dependency-path: native/pc-pion/go.sum
      - name: Native build dependencies (Cubeb PulseAudio + ALSA)
        run: sudo apt-get update && sudo apt-get install -y build-essential libpulse-dev libasound2-dev pkg-config cmake nasm
      - name: Rust formatting
        run: |
          cargo fmt --manifest-path native/pc-capture/Cargo.toml --all -- --check
          cargo fmt --manifest-path native/vendor/cubeb/Cargo.toml --all -- --check
          cargo fmt --manifest-path native/vendor/cubeb-sys/Cargo.toml --all -- --check
          cargo fmt --manifest-path native/apm-sys/Cargo.toml --all -- --check
          cargo fmt --manifest-path native/pion-sys/Cargo.toml --all -- --check
      - name: Verify Cubeb backend feature isolation
        shell: bash
        run: |
          python3 scripts/verify-cubeb-provenance.py --root .
          ! grep -q '^name = "cpal"$' native/pc-capture/Cargo.lock
          linux_features="$(cargo tree --locked --manifest-path native/pc-capture/Cargo.toml --target x86_64-unknown-linux-gnu -e features -i cubeb-sys)"
          mac_features="$(cargo tree --locked --manifest-path native/pc-capture/Cargo.toml --target x86_64-apple-darwin -e features -i cubeb-sys)"
          windows_features="$(cargo tree --locked --manifest-path native/pc-capture/Cargo.toml --target x86_64-pc-windows-msvc -e features -i cubeb-sys)"
          [[ "$linux_features" == *'cubeb-sys feature "unittest-build"'* ]]
          [[ "$mac_features" != *'cubeb-sys feature "unittest-build"'* ]]
          [[ "$windows_features" != *'cubeb-sys feature "unittest-build"'* ]]
      - name: Test patched Cubeb callback ownership and libcubeb binding
        run: |
          cargo check --locked --manifest-path native/vendor/cubeb-sys/Cargo.toml --features unittest-build
          cargo test --locked --manifest-path native/vendor/cubeb/Cargo.toml --lib
      - name: Pion formatting, vet, tests, and license inventory
        run: |
          unformatted="$(find native/pc-pion -type f -name '*.go' -exec gofmt -l {} +)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
          (cd native/pc-pion && go vet -mod=readonly ./...)
          (cd native/pc-pion && go test -buildvcs=false -mod=readonly ./...)
          python3 scripts/verify-pion-license-inventory.py
          bash scripts/build-pion.sh linux-x64
      - name: Lint desktop shared core
        run: cargo clippy --locked --manifest-path native/pc-capture/Cargo.toml --all-targets -- -D warnings
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-audit@0.22.2
      - name: Audit native dependency locks
        run: |
          cargo audit --file native/pc-capture/Cargo.lock
          cargo audit --no-fetch --file native/vendor/cubeb-sys/libcubeb/src/cubeb-coreaudio-rs/Cargo.lock
          cargo audit --no-fetch --file native/vendor/cubeb-sys/libcubeb/src/cubeb-pulse-rs/Cargo.lock
          cargo audit --no-fetch --file native/apm-sys/Cargo.lock
          cargo audit --no-fetch --file native/pion-sys/Cargo.lock
      - name: Test desktop shared core
        env:
          PC_PION_LIB: ${{ github.workspace }}/artifacts/pion/libpc-pion.so
          PC_REQUIRE_PION: "1"
          PC_PION_TEST_DISABLE_MDNS: "1"
        run: |
          cargo test --locked --manifest-path native/pion-sys/Cargo.toml --all-targets
          cargo test --locked --manifest-path native/pc-capture/Cargo.toml --all-targets
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-about@0.9.1
      - name: Verify native dependency license inventory
        run: |
          python3 scripts/verify-native-license-inventory.py --self-test
          cargo fetch --locked --manifest-path native/pc-capture/Cargo.toml
          cargo about generate \
            --manifest-path native/pc-capture/Cargo.toml \
            --config native/cargo-about.toml \
            native/cargo-about.hbs \
            --frozen --fail \
            --output-file "$RUNNER_TEMP/native-rust-dependencies.html"
          python3 scripts/verify-native-license-inventory.py \
            Libs/native-rust-dependencies.html \
            "$RUNNER_TEMP/native-rust-dependencies.html"
          python3 scripts/generate-cubeb-license-inventories.py \
            --root . \
            --output-dir "$RUNNER_TEMP/cubeb-license-inventories"
          python3 scripts/verify-native-license-inventory.py \
            Libs/cubeb-coreaudio-rust-dependencies.html \
            "$RUNNER_TEMP/cubeb-license-inventories/cubeb-coreaudio-rust-dependencies.html"

  worker:
    name: Cloudflare worker tests and dry run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/perfect-comms-lobbies
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/perfect-comms-lobbies/package-lock.json
      - name: Install locked Worker dependencies
        run: npm ci
      - name: Audit Worker dependencies
        run: npm audit --audit-level=high
      - name: Test Worker request handling
        run: npm test
      - name: Validate Worker deployment bundle
        run: npm run deploy:dry-run
