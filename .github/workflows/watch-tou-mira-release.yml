name: Release with TOU-Mira 1.7.0

on:
  schedule:
    # Poll away from the top of the hour, when scheduled Actions runs are most likely to be delayed.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      validate_release_token:
        description: Validate that RELEASE_TAG_TOKEN can push a tag without creating one
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tou-mira-1.7.0-release-watcher
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: AU-Avengers/TOU-Mira
  UPSTREAM_TAG: 1.7.0
  RELEASE_TAG: v4.1.7
  REQUIRED_API_PACKAGE_VERSION: 4.1.7.1
  RELEASE_SETTLE_SECONDS: "600"

jobs:
  watch:
    name: Watch TOU-Mira release
    runs-on: ubuntu-latest
    steps:
      - name: Verify published TOU-Mira release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"

          release_json="$(mktemp)"
          release_error="$(mktemp)"
          if ! gh api \
            "repos/$UPSTREAM_REPOSITORY/releases/tags/$UPSTREAM_TAG" \
            > "$release_json" 2> "$release_error"; then
            if grep -Fq "HTTP 404" "$release_error"; then
              echo "TOU-Mira $UPSTREAM_TAG is not published yet."
              exit 0
            fi
            cat "$release_error" >&2
            exit 1
          fi

          if [[ "$(jq -r '.tag_name' "$release_json")" != "$UPSTREAM_TAG" ]] || \
             [[ "$(jq -r '.draft' "$release_json")" != "false" ]] || \
             [[ "$(jq -r '.prerelease' "$release_json")" != "false" ]] || \
             [[ "$(jq -r '.published_at // empty' "$release_json")" == "" ]]; then
            echo "TOU-Mira $UPSTREAM_TAG exists but is not a published stable release."
            exit 0
          fi

          asset_count="$(jq '[.assets[] | select(
            .name == "TownOfUsMira.dll" and
            .state == "uploaded" and
            .size > 0
          )] | length' "$release_json")"
          if [[ "$asset_count" != "1" ]]; then
            echo "TOU-Mira $UPSTREAM_TAG is published, but its TownOfUsMira.dll asset is not ready."
            exit 0
          fi

          published_at="$(jq -r '.published_at' "$release_json")"
          published_epoch="$(date -u -d "$published_at" +%s)"
          now_epoch="$(date -u +%s)"
          release_age="$((now_epoch - published_epoch))"
          if (( release_age < RELEASE_SETTLE_SECONDS )); then
            echo "TOU-Mira $UPSTREAM_TAG is only ${release_age}s old; waiting for the 10-minute settle period."
            exit 0
          fi

          existing_tag_count="$(
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" |
              jq --arg ref "refs/tags/$RELEASE_TAG" '[.[] | select(.ref == $ref)] | length'
          )"
          if [[ "$existing_tag_count" != "0" ]]; then
            echo "Perfect Comms $RELEASE_TAG already exists; no release action is needed."
            exit 0
          fi

          csproj="$(mktemp)"
          integration="$(mktemp)"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$UPSTREAM_REPOSITORY/contents/TownOfUs/TownOfUsMira.csproj?ref=$UPSTREAM_TAG" \
            > "$csproj"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$UPSTREAM_REPOSITORY/contents/TownOfUs/Integrations/PerfectCommsIntegration.cs?ref=$UPSTREAM_TAG" \
            > "$integration"

          python3 - "$csproj" "$integration" "$REQUIRED_API_PACKAGE_VERSION" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          csproj_path, integration_path, expected_package = sys.argv[1:]
          root = ET.parse(csproj_path).getroot()
          package_versions = []
          for reference in root.iter("PackageReference"):
              if reference.get("Include") != "PerfectComms.Api":
                  continue
              package_versions.append(reference.get("Version") or reference.findtext("Version") or "")
          if package_versions != [expected_package]:
              raise SystemExit(
                  f"TOU-Mira release tag does not reference PerfectComms.Api {expected_package}: "
                  f"found {package_versions or 'none'}"
              )

          source = Path(integration_path).read_text(encoding="utf-8-sig")
          required_markers = (
              "internal static class PerfectCommsIntegration",
              'internal const string PluginId = "com.edgetel.perfectcomms";',
              "PerfectCommsApi.RegisterVoiceRule",
              "VoiceApiCapability.ListenerSightObscuration",
          )
          missing = [marker for marker in required_markers if marker not in source]
          if missing:
              raise SystemExit(
                  "TOU-Mira release tag is missing required Perfect Comms integration markers: "
                  + ", ".join(missing)
              )
          PY

          echo "TOU-Mira $UPSTREAM_TAG is published, settled, and contains the Perfect Comms 4.1.7 integration."
          echo "upstream_release_url=$(jq -r '.html_url' "$release_json")" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify release credential
        if: steps.upstream.outputs.ready == 'true' || (github.event_name == 'workflow_dispatch' && inputs.validate_release_token)
        shell: bash
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG_TOKEN" ]]; then
            echo "The RELEASE_TAG_TOKEN Actions secret is missing." >&2
            exit 1
          fi

      - name: Check out Perfect Comms release source
        if: steps.upstream.outputs.ready == 'true' || (github.event_name == 'workflow_dispatch' && inputs.validate_release_token)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Validate release credential tag access
        if: github.event_name == 'workflow_dispatch' && inputs.validate_release_token
        shell: bash
        run: |
          set -euo pipefail
          validation_tag="perfectcomms-release-token-check-${GITHUB_RUN_ID}"
          git push --dry-run origin "HEAD:refs/tags/$validation_tag"
          echo "RELEASE_TAG_TOKEN can push a tag; no tag was created."

      - name: Verify pinned Perfect Comms release source
        if: steps.upstream.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ vars.PERFECTCOMMS_417_RELEASE_SHA }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_RELEASE_SHA" ]]; then
            echo "The PERFECTCOMMS_417_RELEASE_SHA Actions variable is missing." >&2
            exit 1
          fi

          checked_out_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$checked_out_sha" != "$EXPECTED_RELEASE_SHA" ]] || \
             [[ "$remote_main_sha" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Refusing to release an unapproved main revision: expected=$EXPECTED_RELEASE_SHA checked-out=$checked_out_sha remote=$remote_main_sha" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Refusing to replace existing tag $RELEASE_TAG." >&2
            exit 1
          fi

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("PerfectComms.csproj").getroot()
          values = {child.tag: (child.text or "").strip() for group in root.findall("PropertyGroup") for child in group}
          expected = {
              "Version": "4.1.7",
              "PerfectCommsApiPackageVersion": "4.1.7.1",
              "AssemblyVersion": "4.1.7.0",
              "FileVersion": "4.1.7.0",
              "InformationalVersion": "4.1.7",
          }
          mismatches = {key: values.get(key) for key, value in expected.items() if values.get(key) != value}
          if mismatches:
              raise SystemExit(f"Perfect Comms release version mismatch: {mismatches}")

          plugin = Path("VoiceChatPluginMain.cs").read_text(encoding="utf-8-sig")
          if not re.search(r'public const string Version = "4\.1\.7";', plugin):
              raise SystemExit("VoiceChatPluginMain.Version is not 4.1.7")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8-sig")
          required_notice = (
              "TOU-Mira v1.7.0 and later require Perfect Comms v4.1.7 or newer. "
              "Perfect Comms v4.1.6 and earlier support TOU-Mira only through v1.6.3."
          )
          if "## Perfect Comms v4.1.7" not in changelog or required_notice not in changelog:
              raise SystemExit("CHANGELOG.md is missing the v4.1.7 TOU-Mira compatibility notice")
          PY

      - name: Tag Perfect Comms v4.1.7
        if: steps.upstream.outputs.ready == 'true'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ vars.PERFECTCOMMS_417_RELEASE_SHA }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$EXPECTED_RELEASE_SHA" \
            -m "Perfect Comms v4.1.7 coordinated with TOU-Mira v1.7.0"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "Created $RELEASE_TAG after detecting ${{ steps.upstream.outputs.upstream_release_url }}"
