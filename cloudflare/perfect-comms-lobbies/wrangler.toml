name = "perfect-comms-lobbies"
main = "src/index.js"
compatibility_date = "2026-05-13"

[vars]
UPDATE_LATEST_VERSION = "v1.0.1"
UPDATE_RELEASE_URL = "https://github.com/artriy/Perfect-Comms/releases/tag/v1.0.1"
UPDATE_RELEASE_FALLBACK_VERSION = "v1.0.1"
UPDATE_RELEASE_FALLBACK_URL = "https://github.com/artriy/Perfect-Comms/releases/tag/v1.0.1"

[[durable_objects.bindings]]
name = "LOBBY_HUB"
class_name = "LobbyHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyHub"]

[[ratelimits]]
name = "TURN_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
